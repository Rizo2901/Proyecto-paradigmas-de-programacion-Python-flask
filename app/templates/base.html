<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{% block title %}Pokemon Carts{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
 
    <!-- Overlay oscuro para el fondo -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar (menú lateral) -->
<aside id="sidebar" class="sidebar">
<h2>Menú</h2>
<ul>
<li><a href="/">Inicio</a></li>
<li><a href="/clientes/pagina">Clientes</a></li>
<li><a href="/pedidos/pagina">Pedidos</a></li>
<li><a href="/">Cartas</a></li>
</ul>
</aside>
 
    <!-- Contenido principal -->
<div class="main-container">
 
        <!-- Header -->
<header class="header">
<div class="left">
<button id="menuBtn" class="menu-btn">☰</button>
<h1>Pokemon Carts</h1>
</div>
<div class="right">
<div class="cart-icon-container">
<button id="cartIcon" class="cart-icon" onclick="verCarrito()" title="Ver carrito">
🛒
<span id="cartBadge" class="cart-badge">0</span>
</button>
</div>
</div>
</header>
 
        <!-- Contenido dinámico -->
<main class="content">
            {% block content %}{% endblock %}
</main>
 
        <!-- Footer -->
<footer class="footer">
<p>© 2025 Pokemon Carts — Todos los derechos reservados</p>
</footer>
 
    </div>
 
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/carrito.js') }}"></script>
</body>
</html>
