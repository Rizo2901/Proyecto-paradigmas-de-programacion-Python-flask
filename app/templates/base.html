<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{% block title %}Pokemon Carts{% endblock %}</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>
<body>
 
    <!-- Overlay oscuro para el fondo -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar (menú lateral) -->
<aside id="sidebar" class="sidebar">
<h2>Menú</h2>
<ul>
<li><a href="/">Inicio</a></li>
<li><a href="/clientes/pagina">Clientes</a></li>
<li><a href="/pedidos/pagina">Pedidos</a></li>
<li><a href="/cartas/pagina">Cartas</a></li>
</ul>
</aside>
 
    <!-- Contenido principal -->
<div class="main-container">
 
        <!-- Header -->

        <header class="header">
            <div class="left">
                <button id="menuBtn" class="menu-btn">☰</button>
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Pokemon Carts Logo" class="header-logo">
                <h1>Pokemon Carts</h1>
            </div>
            <div class="right">
                <div class="cart-icon-container">
                    <button id="cartIcon" class="cart-icon" title="Ver carrito">
                        🛒
                        <span id="cartBadge" class="cart-badge">0</span>
                      </button>
                      
                     
                </div>
                </div>
           
        </header>
         
        
        
        <!-- Contenido dinámico -->
<main class="content">
            {% block content %}{% endblock %}
</main>
 
        <!-- Footer -->
<footer class="footer">
<p>© 2025 Pokemon Carts — Todos los derechos reservados</p>
</footer>
 
    </div>
 
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/carrito_detalle.js') }}"></script>
    <!-- Bootstrap JS Bundle (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("cartIcon").addEventListener("click", function() {
      window.location.href = "/carrito_detalle/pagina";
    });
  </script>
</body>



</html>
